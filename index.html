<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14171C" />
    <meta name="description" content="Mirror — a personal gym training PWA: 12-week program, rest timer with lock-screen alerts, fuel and off-day tracking." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Mirror — Training</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; background: #14171C; }
      body { -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; }
      button, a, [role="button"] {
        transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease, color 160ms ease;
      }
      button:active, a:active, [role="button"]:active { transform: scale(0.96); }
      ::selection { background: rgba(230, 138, 90, 0.35); }
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
